[project]
name = "jax-rl"
version = "0.1.0"
description = "Reinforcement learning algorithms from Sutton & Barto, implemented in JAX"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jax>=0.4.30",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pytest>=9.1.1",
    "pip>=26.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jax_rl"]

[tool.uv]
package = true

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
